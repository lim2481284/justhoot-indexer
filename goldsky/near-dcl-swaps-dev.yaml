name: justhoot-near-dcl-swaps-dev
resource_size: s
description: Index Ref DCL swaps and JustHoot NEP-141 balance events

sources:
  execution_outcomes:
    type: dataset
    dataset_name: near.execution_outcomes
    version: 1.1.0
    start_at: latest

transforms:
  dcl_outcomes:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id,
        logs,
        status,
        transaction_hash,
        trigger_block_height,
        trigger_block_timestamp
      FROM execution_outcomes
      WHERE executor_id = 'dclv2.ref-labs.near'

  parsed_swaps:
    type: script
    from: dcl_outcomes
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      transaction_hash: string
      event_index: int64
      block_height: int64
      timestamp: string
      pool_id: string
      token_in: string
      token_out: string
      amount_in_raw: string
      amount_out_raw: string
      amount_in: string
      amount_out: string
      price: string
      swapper: string
      total_fee: string
      protocol_fee: string
    script: |
      function invoke(data) {
        const poolId = "17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1|wrap.near|100";
        const usdc = "17208628f84f5d6ad33f0da3bbbeb27ffcb398eac501a31bd6ad2011e36133a1";
        const wnear = "wrap.near";

        function formatUnits(raw, decimals) {
          const negative = raw.startsWith("-");
          const digits = negative ? raw.slice(1) : raw;
          const padded = digits.padStart(decimals + 1, "0");
          const whole = padded.slice(0, -decimals) || "0";
          const fraction = padded.slice(-decimals).replace(/0+$/, "");
          return (negative ? "-" : "") + whole + (fraction ? "." + fraction : "");
        }

        let status;
        try {
          status = JSON.parse(data.status);
        } catch (_) {
          return [];
        }

        if (!("SuccessValue" in status) && !("SuccessReceiptId" in status)) {
          return [];
        }

        const output = [];
        const logs = Array.isArray(data.logs) ? data.logs : [];

        for (let logIndex = 0; logIndex < logs.length; logIndex++) {
          const log = logs[logIndex];
          if (typeof log !== "string" || !log.startsWith("EVENT_JSON:")) continue;

          let event;
          try {
            event = JSON.parse(log.slice("EVENT_JSON:".length));
          } catch (_) {
            continue;
          }

          if (event.standard !== "dcl.ref" || event.event !== "swap" || !Array.isArray(event.data)) continue;

          for (let dataIndex = 0; dataIndex < event.data.length; dataIndex++) {
            const swap = event.data[dataIndex];
            if (swap.pool_id !== poolId) continue;
            if (!swap.amount_in || !swap.amount_out) continue;

            const inDecimals = swap.token_in === usdc ? 6 : swap.token_in === wnear ? 24 : null;
            const outDecimals = swap.token_out === usdc ? 6 : swap.token_out === wnear ? 24 : null;
            if (inDecimals === null || outDecimals === null) continue;

            const amountIn = formatUnits(swap.amount_in, inDecimals);
            const amountOut = formatUnits(swap.amount_out, outDecimals);
            const usdcAmount = swap.token_in === usdc ? amountIn : amountOut;
            const wnearAmount = swap.token_in === wnear ? amountIn : amountOut;
            const price = Number(usdcAmount) / Number(wnearAmount);
            if (!Number.isFinite(price) || price <= 0) continue;

            const eventIndex = logIndex * 1000 + dataIndex;
            output.push({
              event_id: data.id + ":" + logIndex + ":" + dataIndex,
              transaction_hash: data.transaction_hash,
              event_index: eventIndex,
              block_height: data.trigger_block_height,
              timestamp: new Date(data.trigger_block_timestamp).toISOString(),
              pool_id: swap.pool_id,
              token_in: swap.token_in,
              token_out: swap.token_out,
              amount_in_raw: swap.amount_in,
              amount_out_raw: swap.amount_out,
              amount_in: amountIn,
              amount_out: amountOut,
              price: price.toFixed(18),
              swapper: swap.swapper || "",
              total_fee: swap.total_fee || "0",
              protocol_fee: swap.protocol_fee || "0"
            });
          }
        }

        return output;
      }

  justhoot_token_outcomes:
    type: sql
    primary_key: id
    sql: |
      SELECT
        id,
        executor_id,
        logs,
        status,
        transaction_hash,
        trigger_block_height,
        trigger_block_timestamp
      FROM execution_outcomes
      WHERE executor_id = 'launchpad.justhoot.near'
         OR executor_id LIKE '%.launchpad.justhoot.near'

  parsed_balance_events:
    type: script
    from: justhoot_token_outcomes
    language: typescript
    primary_key: event_id
    schema:
      event_id: string
      transaction_hash: string
      event_index: int64
      token_id: string
      account_id: string
      delta_raw: string
      event_type: string
      block_height: int64
      timestamp: string
    script: |
      function invoke(data) {
        let status;
        try {
          status = typeof data.status === "string" ? JSON.parse(data.status) : data.status;
        } catch (_) {
          return [];
        }

        if (!status || (!("SuccessValue" in status) && !("SuccessReceiptId" in status))) {
          return [];
        }

        function validAmount(value) {
          return typeof value === "string" && /^[0-9]+$/.test(value) && value !== "0";
        }

        const output = [];
        const logs = Array.isArray(data.logs) ? data.logs : [];

        for (let logIndex = 0; logIndex < logs.length; logIndex++) {
          const log = logs[logIndex];
          if (typeof log !== "string" || !log.startsWith("EVENT_JSON:")) continue;

          let event;
          try {
            event = JSON.parse(log.slice("EVENT_JSON:".length));
          } catch (_) {
            continue;
          }

          if (event.standard !== "nep141" || !Array.isArray(event.data)) continue;
          if (!["ft_mint", "ft_transfer", "ft_burn"].includes(event.event)) continue;

          for (let dataIndex = 0; dataIndex < event.data.length; dataIndex++) {
            const item = event.data[dataIndex];
            if (!validAmount(item.amount)) continue;

            const base = {
              transaction_hash: data.transaction_hash,
              token_id: data.executor_id,
              block_height: data.trigger_block_height,
              timestamp: new Date(data.trigger_block_timestamp).toISOString()
            };
            const baseIndex = logIndex * 1000000 + dataIndex * 10;

            if (event.event === "ft_mint" && typeof item.owner_id === "string") {
              output.push({
                ...base,
                event_id: data.id + ":" + logIndex + ":" + dataIndex + ":mint",
                event_index: baseIndex,
                account_id: item.owner_id,
                delta_raw: item.amount,
                event_type: "mint"
              });
            }

            if (event.event === "ft_burn" && typeof item.owner_id === "string") {
              output.push({
                ...base,
                event_id: data.id + ":" + logIndex + ":" + dataIndex + ":burn",
                event_index: baseIndex,
                account_id: item.owner_id,
                delta_raw: "-" + item.amount,
                event_type: "burn"
              });
            }

            if (
              event.event === "ft_transfer" &&
              typeof item.old_owner_id === "string" &&
              typeof item.new_owner_id === "string"
            ) {
              output.push({
                ...base,
                event_id: data.id + ":" + logIndex + ":" + dataIndex + ":debit",
                event_index: baseIndex,
                account_id: item.old_owner_id,
                delta_raw: "-" + item.amount,
                event_type: "transfer"
              });
              output.push({
                ...base,
                event_id: data.id + ":" + logIndex + ":" + dataIndex + ":credit",
                event_index: baseIndex + 1,
                account_id: item.new_owner_id,
                delta_raw: item.amount,
                event_type: "transfer"
              });
            }
          }
        }

        return output;
      }

sinks:
  postgres_swaps:
    type: postgres
    from: parsed_swaps
    schema: public
    table: swaps
    secret_name: JUSTHOOT_RAILWAY_POSTGRES
    primary_key: event_id

  postgres_balance_events:
    type: postgres
    from: parsed_balance_events
    schema: public
    table: token_balance_events
    secret_name: JUSTHOOT_RAILWAY_POSTGRES
    primary_key: event_id
